[package]
name = "babawus"
description = "Basic backup with USB storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
babawus-core.workspace = true
gtk4.workspace = true

[package.metadata.deb]
maintainer = "Steen K <steen@kroeyer.net>"
section = "utils"
# Shown below the summary by the installer (Issues.md item 111).
extended-description = """\
Babawus backs up your important files to a USB stick, with one button.

It copies only what has changed, keeps older versions of each file, and says in plain words whether the backup worked. One stick can hold the backups of several computers and accounts.

Whoever looks after the computer prepares the stick and chooses what is backed up, under Advanced. Sticks are formatted as exFAT, which also works on Windows and Mac, or Ext4."""
depends = "$auto, udisks2, exfatprogs, e2fsprogs, acl"
assets = [
    ["target/release/babawus", "usr/bin/", "755"],
    ["assets/io.github.ziggymax.Babawus.desktop", "usr/share/applications/", "644"],
    ["../../assets/BabawusLogo-NoText-plain.svg", "usr/share/icons/hicolor/scalable/apps/io.github.ziggymax.Babawus.svg", "644"],
]
