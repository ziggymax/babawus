[package]
name = "babawus"
description = "Basic backup with USB storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
babawus-core.workspace = true
gtk4.workspace = true

[package.metadata.deb]
maintainer = "Steen K <steen@kroeyer.net>"
section = "utils"
# Shown below the summary by the installer (issue 111).
extended-description = """\
Babawus backs up your important files to a USB stick, with one button.

It copies only what has changed, keeps older versions of each file, and says in plain words whether the backup worked. One stick can hold the backups of several computers and accounts.

Preparing a stick and choosing what is backed up are advanced functions, under Advanced in the menu. Sticks are formatted as exFAT, which also works on Windows and Mac, or Ext4."""
depends = "$auto, udisks2, exfatprogs, e2fsprogs, acl"
assets = [
    ["target/release/babawus", "usr/bin/", "755"],
    ["assets/io.github.ziggymax.Babawus.desktop", "usr/share/applications/", "644"],
    ["assets/io.github.ziggymax.Babawus.svg", "usr/share/icons/hicolor/scalable/apps/io.github.ziggymax.Babawus.svg", "644"],
    # The language files, read at start (issue 147).
    ["../../languages/*.toml", "usr/share/babawus/languages/", "644"],
]
