name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Ubuntu containers fetch their packages from the runner's own mirror, which is close by,
# rather than from Ubuntu's, which on a slow day took a job past its 30 minutes (T-133).
env:
  UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu

jobs:
  check:
    # Linux Mint 22 is based on Ubuntu 24.04, so this has the same GTK version.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The week in the key refreshes the cache as packages get updates. Downloads are only a
      # shortcut: apt checks each file, and fetches anything that is missing or out of date.
      - name: Work out the cache week
        id: cache-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ steps.cache-week.outputs.week }}
          restore-keys: apt-${{ runner.os }}-

      # The mirror has been slow enough to take a run from one minute to thirteen. A short timeout
      # makes a stalled download retry soon.
      - name: Install system packages
        run: |
          mkdir -p ~/apt-archives/partial
          sudo tee /etc/apt/apt.conf.d/99ci > /dev/null <<EOF
          Dir::Cache::archives "$HOME/apt-archives/";
          Acquire::http::Timeout "20";
          Acquire::Retries "3";
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config exfatprogs udisks2 acl

      # The tests format loop devices through udisks2. On a desktop, polkit lets the user of the
      # active session do that, but the runner has no session, so this rule lets it on CI only.
      - name: Allow udisks2 for the runner
        run: |
          sudo tee /etc/polkit-1/rules.d/50-babawus-ci.rules > /dev/null <<'EOF'
          polkit.addRule(function (action, subject) {
              if (action.id.indexOf("org.freedesktop.udisks2.") == 0 && subject.user == "runner") {
                  return polkit.Result.YES;
              }
          });
          EOF

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --target x86_64-pc-windows-gnu
          rustup default stable

      # Keyed on the compiler version and Cargo.lock, so it needs no attention when they change.
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Only babawus-core, whose platform layer has a Windows placeholder, so that Linux-only code
      # can't slip back into the shared parts. Clippy rather than check, so warnings count too.
      - name: Check that babawus-core builds for Windows
        run: cargo clippy --locked -p babawus-core --target x86_64-pc-windows-gnu -- -D warnings

      - name: Run all tests, including those on real file systems
        run: cargo test --locked -- --include-ignored

  # Clippy and the unit tests on the other distributions, in the same containers as on the host
  # (T-119). Ubuntu 24.04 is covered by the job above, on its own runner (issue 169).
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The names in containers/common.sh.
        name: [ubuntu-26.04, fedora-45]
    name: check (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - name: Work out the cache week
        id: cache-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # Downloaded crates and compiled dependencies, as the script keeps them on the host. The week
      # starts afresh now and then, so that the cache doesn't grow with old builds.
      - name: Restore build output
        uses: actions/cache@v6
        with:
          path: target/containers/${{ matrix.name }}
          key: containers-${{ matrix.name }}-${{ steps.cache-week.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: containers-${{ matrix.name }}-${{ steps.cache-week.outputs.week }}-

      - name: Clippy and unit tests
        run: containers/check.sh ${{ matrix.name }}

      # The .rpm, installed in a clean Fedora as a user would (T-121, issue 169).
      - name: Build the .rpm and check that it installs
        if: matrix.name == 'fedora-45'
        run: containers/package.sh rpm

      # Handed to the packages job below, which keeps both packages together (T-129).
      - name: Hand on the .rpm
        if: matrix.name == 'fedora-45'
        uses: actions/upload-artifact@v7
        with:
          name: package-rpm
          path: target/containers/packages/*.rpm
          if-no-files-found: error
          retention-days: 1

  # The .deb, built in the Ubuntu 24.04 container and installed in clean images of Ubuntu 24.04
  # and 26.04, as a user would (T-122, T-133).
  package-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: package (deb)
    steps:
      - uses: actions/checkout@v7

      - name: Work out the cache week
        id: cache-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # Downloaded crates, compiled dependencies, cargo-deb and cargo-about, as the script keeps them
      # on the host.
      - name: Restore build output
        uses: actions/cache@v6
        with:
          path: target/containers/ubuntu-24.04
          key: containers-ubuntu-24.04-${{ steps.cache-week.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: containers-ubuntu-24.04-${{ steps.cache-week.outputs.week }}-

      - name: Build the .deb and check that it installs
        run: containers/package.sh deb

      - name: Hand on the .deb
        uses: actions/upload-artifact@v7
        with:
          name: package-deb
          path: target/containers/packages/*.deb
          if-no-files-found: error
          retention-days: 1

  # Both packages, with their SHA-256 sums, kept as the run's artifact "packages" (T-129). For a
  # release, the smoke test and the checklist run on the artifact of main's commit, and the same
  # files are attached to the GitHub release (TestSetup.md, "A release, step by step"). Only the
  # newest of each branch is kept, so that a pull request's packages can be tried on a VM and a
  # release made from main's, without old ones piling up (T-134).
  packages:
    needs: [distribution, package-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Deleting artifacts needs actions: write, for this job only.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Fetch both packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Write their SHA-256 sums
        working-directory: packages
        run: sha256sum *.deb *.rpm | tee SHA256SUMS

      - name: Keep them
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

      # This run's two hand-offs, and the hand-offs and packages of older runs on the same branch,
      # older by run ID, so that a slow older run never deletes a newer one's (T-134). A pull request from a fork gets
      # a token that can't delete, which mustn't fail its checks.
      - name: Delete the hand-offs and the branch's older packages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "
            .artifacts[]
            | select(.expired | not)
            | select(
                ((.name == \"package-deb\" or .name == \"package-rpm\")
                  and (.workflow_run.id == $GITHUB_RUN_ID
                    or (.workflow_run.head_branch == \$ENV.BRANCH
                      and .workflow_run.id < $GITHUB_RUN_ID)))
                or (.name == \"packages\" and .workflow_run.head_branch == \$ENV.BRANCH
                  and .workflow_run.id < $GITHUB_RUN_ID))
            | \"\\(.id) \\(.name) \\(.workflow_run.id)\"" |
          while read -r id name run; do
            echo "Deleting $name of run $run"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
