[workspace]
resolver = "3"
members = ["crates/babawus-core", "crates/babawus"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
babawus-core = { path = "crates/babawus-core" }
# The gio that gtk4 uses, for udisks2 over D-Bus.
gio = "0.22"
# v4_14 is the GTK version in Linux Mint 22. Do not raise it above the supported platform.
gtk4 = { version = "0.11", features = ["v4_14"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
