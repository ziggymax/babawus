[workspace]
resolver = "3"
members = ["crates/babawus-core", "crates/babawus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
babawus-core = { path = "crates/babawus-core" }
# v4_14 is the GTK version in Linux Mint 22. Do not raise it above the supported platform.
gtk4 = { version = "0.11", features = ["v4_14"] }
libc = "0.2"
