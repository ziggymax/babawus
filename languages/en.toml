# The built-in Help, shown in a window of its own (issues 151, 154 and 158). A line starting with
# "# " is a heading, a line starting with "- " is a bullet, and blank lines separate paragraphs. A
# line with only "#" and a number, such as "#14", begins the entry for that numbered message, and
# Babawus writes the message after the number itself: every number needs an entry. Another text
# is put in with its name in braces, such as {ChangeSetup}. Quotation marks are written as plain
# "", and shown as the marks in quotes above.
Help = """
# What Babawus does

Babawus copies your important files and folders to a USB stick, so that you still have them if your computer breaks, is lost or is stolen, or if you delete or spoil a file by mistake.

It only copies what has changed since the last backup. When a file has changed, the copy on the stick is replaced, and the earlier copy is kept as an older version. Files you delete on the computer are never deleted from the stick.

# Backing up

- Plug in your backup stick.
- Choose it in the list, if it isn't chosen already.
- Press "{StartBackup}", and wait for the verdict.
- When it says "{VerdictAllGood}", press "Eject", and pull out the stick.

Keep the stick away from the computer between backups, so that whatever happens to the computer doesn't happen to the stick too. Two sticks, used in turn, are safer than one.

"{ShowHistory}" shows when backups to the stick ran and how they went. "{WhatsBackedUp}" shows which of your files and folders are copied to it.

# Getting files back

Press "{RestoreFiles}" below the stick to get files back. Tick the files and folders you want, as when choosing what to back up. A file shows its newest copy and its older versions, each with its date: select it, and choose a version on the right. The files go back where they were, or into another folder that you choose, and Babawus asks first about files that are already there. Babawus never changes the stick while restoring.

You can also open the stick in the file manager: your files are in the folder "backup", under the computer's and your own name, in the same folders as on the computer. The older versions of a file are in a folder next to it, named like the file with [] in it, such as report[]pdf for report.pdf, each with the date and time it was replaced in its name.

# Advanced functions

Under {MenuAdvanced} in the menu are the functions that set up a stick: "{Prepare}" erases a stick and makes it ready for Babawus, and "{ChangeSetup}" chooses what is backed up, and for which computers and accounts. A mistake here can cost backups, so Babawus asks first. {MenuAdvanced} turns off again when Babawus is closed.

# Messages

When something goes wrong, the message ends with a number, such as #14. Search for that number here to see what it means and what to do.

#1
The system hasn't opened the stick's files. If plugging it in again doesn't help, open the stick in the file manager.

#2
The stick has nothing on it that Babawus can read, for example because it is new or was used for something else. Prepare it under {MenuAdvanced}, with "{Prepare}". That erases everything on it.

#3
Babawus uses the system's udisks2 service to find USB sticks.

#4
Only one Babawus can run on a computer at a time, so it has to be closed in the other account first.

#5
Each computer and account must be added to a stick before it can back up to it. Do that under {MenuAdvanced}, with "{ChangeSetup}" and "{SetupAddComputer}".

#6
If the stick was set up with a newer Babawus, install that version here too. Otherwise the setup is damaged: open it under {MenuAdvanced}, with "{ChangeSetup}", check it, and save it.

#7
Some sticks have a small lock switch. A stick that can no longer be written to may be worn out; use another one.

#8
Another account on this computer has the stick open, so this account can't use it.

#9
Prepare it under {MenuAdvanced}, with "{Prepare}". That erases everything on it, so first copy anything you want to keep.

#10
The stick was pulled out during the backup. Nothing already on it is damaged. Plug it back in and run the backup again: it carries on where it stopped.

#11
The backup was stopped part of the way, for example because the computer was shut down. Run it again: it carries on where it stopped.

#12
Babawus ended in the middle of the backup. Nothing already on the stick is damaged. Run the backup again.

#13
The stick didn't confirm that everything was written. Run the backup again. If it happens again, the stick may be failing; use another one.

#14
There isn't room for the files that changed. Keep fewer older versions under {MenuAdvanced}, with "{ChangeSetup}", back up fewer files, or use a bigger stick.

#15
The setup changed after the backup was started. See #5.

#16
See #6.

#17
Check whether the stick has a lock switch, see #7. Otherwise it may be failing; use another one.

#18
Wait until it has finished, then try again.

#19
The file or folder couldn't be read on the computer, usually because your account isn't allowed to read it. It is skipped.

#20
The file was deleted or moved while the backup ran. It is backed up next time, if it is still there.

#21
The stick refused the file. Run the backup again. If it happens again, see #17.

#22
Something that used to be a folder is now a file with the same name, or the other way round. Rename it on the computer, or remove the old one from the stick in the file manager.

#23
A program kept changing the file during the backup. Close that program, and run the backup again.

#24
An older version's name adds the date to the name, which made it too long. Give the file a shorter name.

#25
Sticks formatted as exFAT can't store the characters " * : < > ? \\ | in names. Rename the file, or use a stick formatted as Ext4.

#26
Rename the file so that its name doesn't end with a dot.

#27
The name has characters the computer can't show as text. Rename the file.

#28
The name, or the names of the folders it is in, are too long for the stick. Use shorter names, or fewer folders inside each other.

#29
Babawus keeps older versions in folders whose names contain [], and this name contains [] too. Rename it.

#30
exFAT sticks can't tell "Photo.jpg" from "photo.jpg". Rename one of them.

#31
A file or folder that was chosen has been deleted, moved or renamed. Choose it again under {MenuAdvanced}, with "{ChangeSetup}".

#32
Only files in your home folder are backed up. Choose files inside it under {MenuAdvanced}, with "{ChangeSetup}".

#33
Close the program, for example a file manager window or a terminal open on the stick, or wait until a copy has finished, and eject it again.

#34
If it still fails, shut down the computer before pulling out the stick.

#35
If it happens again, pull the stick out and plug it back in.

#36
Close the log window and try again. If it happens again, pull the stick out and plug it back in.

#37
Choose what to back up under {MenuAdvanced}, with "{ChangeSetup}" and "{SetupChoose}".

#38
If it happens again, see #6.

#39
Babawus only formats USB sticks, never the computer's own disks. Plug in the stick to prepare.

#40
Formatting as Ext4 needs an account with sudo rights and the password for that account. Choose exFAT instead, or prepare the stick from an administrator's account.

#41
The stick was pulled out while it was being formatted. Plug it back in and format it again.

#42
The stick changed after it was chosen, for example because a program opened it. Close that program, go back, and choose the stick again.

#43
