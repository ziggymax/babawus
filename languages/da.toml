# The built-in Help, shown in a window of its own (issues 151, 154 and 158). A line starting with
# "# " is a heading, a line starting with "- " is a bullet, and blank lines separate paragraphs. A
# line with only "#" and a number, such as "#14", begins the entry for that numbered message, and
# Babawus writes the message after the number itself: every number needs an entry. Another text
# is put in with its name in braces, such as {ChangeSetup}. Quotation marks are written as plain
# "", and shown as the marks in quotes above.
Help = """
# Hvad Babawus gør

Babawus kopierer dine vigtige filer og mapper til et USB-stik, så du stadig har dem hvis computeren går i stykker, bliver væk, bliver stjålet eller hvis du ved en fejl sletter eller ødelægger en fil.

Babawus kopierer kun det, der er ændret siden sidste backup. Når en fil er ændret, bliver kopien på USB-stikket erstattet, og den tidligere kopi gemmes som en ældre version. Filer, du sletter på computeren, bliver aldrig slettet fra USB-stikket.

# Tag backup

- Sæt dit backup-stik i.
- Vælg stikket på listen, hvis det ikke allerede er valgt.
- Tryk på "{StartBackup}", og vent på resultatet.
- Når der står "{VerdictAllGood}", så tryk på "Skub ud", og tag USB-stikket ud.

Opbevar USB-stikket væk fra computeren mellem backups, så hvad måtte der ske med computeren, ikke også sker med USB-stikket. To USB-stik, der bruges på skift, er mere sikkert end ét.

"{ShowHistory}" viser, hvornår der blev taget backup til USB-stikket, og hvordan det gik. "{WhatsBackedUp}" viser, hvilke af dine filer og mapper der kopieres til det.

# Få filer tilbage

Babawus har ingen gendannelsesknap. Åbn USB-stikket i filhåndteringen: dine filer ligger i mappen "backup", under computerens og dit eget navn, i de samme mapper som på computeren. Kopiér det, du har brug for, tilbage. De ældre versioner af en fil ligger i en mappe ved siden af med samme navn filen, men med [] i, for eksempel rapport[]pdf for rapport.pdf, hver med dato og klokkeslæt for, hvornår den blev erstattet, i navnet.

# Avancerede funktioner

Under "{MenuAdvanced}" i menuen ligger de funktioner, der sætter et USB-stik op: "{Prepare}" sletter alt på et USB-stik og gør det klar til Babawus, og "{ChangeSetup}" vælger, hvad der tages backup af, og for hvilke computere og konti. En fejl her kan koste backups, så Babawus spørger først. "{MenuAdvanced}" slås fra igen, når Babawus lukkes.

# Meddelelser

Når noget går galt, slutter meddelelsen med et nummer, for eksempel #14. Søg efter nummeret her for at se, hvad det betyder, og hvad du skal gøre.

#1
Systemet har ikke åbnet USB-stikket. Hvis det ikke hjælper at sætte det i igen, så åbn USB-stikket i filhåndteringen.

#2
Der er intet på USB-stikket, som Babawus kan læse, for eksempel fordi det er nyt eller har været brugt til noget andet. Forbered det under "{MenuAdvanced}" med "{Prepare}". Det sletter alt på det.

#3
Babawus bruger systemets tjeneste udisks2 til at finde USB-stik.

#4
Der kan kun køre én Babawus ad gangen på en computer, så det skal først lukkes på den anden konto.

#5
Hver computer og konto skal tilføjes til et USB-stik, før den kan tage backup til det. Gør det under "{MenuAdvanced}" med "{ChangeSetup}" og "{SetupAddComputer}".

#6
Hvis USB-stikket blev sat op med en nyere Babawus, så installér også den version her. Ellers er opsætningen beskadiget: åbn den under "{MenuAdvanced}" med "{ChangeSetup}", kontrollér den, og gem den.

#7
Nogle USB-stik har en lille låseknap. Et USB-stik, der ikke længere kan skrives til, kan være slidt op; brug et andet.

#8
En anden konto på denne computer har USB-stikket åbent, så denne konto kan ikke bruge det.

#9
Forbered det under "{MenuAdvanced}" med "{Prepare}". Det sletter alt på det, så kopiér først det, du vil beholde.

#10
USB-stikket blev taget ud under backuppen. Intet af det, der allerede er på det, er beskadiget. Sæt det i igen, og kør backuppen igen: den fortsætter, hvor den stoppede.

#11
Backuppen blev stoppet undervejs, for eksempel fordi computeren blev slukket. Kør den igen: den fortsætter, hvor den stoppede.

#12
