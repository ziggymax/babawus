#17 Der kan ikke skrives til USB-stikket.
Se efter, om USB-stikket har en låseknap, se #7. Ellers er det måske ved at gå i stykker; brug et andet.

#18 En anden backup til dette USB-stik er ved at starte.
Vent, til den er færdig, og prøv så igen.

#19 Kunne ikke læses.
Filen eller mappen kunne ikke læses på computeren, som regel fordi din konto ikke har lov til at læse den. Den bliver sprunget over.

#20 Forsvandt under backuppen.
Filen blev slettet eller flyttet, mens backuppen kørte. Der tages backup af den næste gang, hvis den stadig er der.

#21 Kunne ikke skrives til USB-stikket.
USB-stikket afviste filen. Kør backuppen igen. Hvis det sker igen, så se #17.

#22 Der er en mappe med samme navn på USB-stikket.
Noget, der før var en mappe, er nu en fil med samme navn, eller omvendt. Omdøb den på computeren, eller fjern den gamle fra USB-stikket i filhåndteringen.

#23 Blev ved med at ændre sig under kopieringen.
Et program blev ved med at ændre filen mens backuppen kørte. Luk programmet, og kør backuppen igen.

#24 Navnet er for langt til at gemme ældre versioner.
En ældre versions navn får datoen tilføjet, og det gjorde navnet for langt. Giv filen et kortere navn.

#25 Navnet har tegn, som dette USB-stik ikke kan gemme.
USB-stik, der er formateret som exFAT, kan ikke gemme tegnene " * : < > ? \\ | i navne. Omdøb filen, eller brug et USB-stik, der er formateret som Ext4.

#26 Navnet ender med et punktum, som dette USB-stik ikke kan gemme.
Omdøb filen, så navnet ikke ender med et punktum.

#27 Navnet er ikke gyldig tekst.
Navnet har tegn, som computeren ikke kan vise som tekst. Omdøb filen.

#28 Navnet eller mappestien er for lang.
Navnet, eller navnene på de mapper, den ligger i, er for lange til USB-stikket. Brug kortere navne eller færre mapper inden i hinanden.

#29 Navnet ligner en mappe med ældre versioner.
Babawus gemmer ældre versioner i mapper, hvis navne indeholder [], og dette navn indeholder også []. Omdøb den.

#30 Navnet adskiller sig kun ved store og små bogstaver fra et andet.
exFAT-USB-stik kan ikke skelne »Foto.jpg« fra »foto.jpg«. Omdøb en af dem.

#31 Valgt til backup, men findes ikke længere.
En fil eller mappe, der blev valgt, er slettet, flyttet eller omdøbt. Vælg den igen under »Avanceret« med »Ændr opsætning…«.

#32 Valgt til backup, men uden for din hjemmemappe.
Der tages kun backup af filer i din hjemmemappe. Vælg filer i hjemmemappen under »Avanceret« med »Ændr opsætning…«.

#33 USB-stikket bruges stadig af et program.
Luk programmet, for eksempel et vindue i filhåndteringen eller en terminal, der er åben på USB-stikket, eller vent, til en kopiering er færdig, og skub det ud igen.

#34 USB-stikket kunne ikke skubbes ud.
Luk de programmer, der bruger det, og prøv igen. Hvis det stadig ikke virker, så sluk computeren, før du tager USB-stikket ud.

#35 Historikken på dette USB-stik kan ikke læses.
Gå tilbage, og prøv igen. Hvis det sker igen, så tag USB-stikket ud, og sæt det i igen.

#36 Loggen på dette USB-stik kan ikke læses.
Luk vinduet med loggen, og prøv igen. Hvis det sker igen, så tag USB-stikket ud, og sæt det i igen.

#37 Der er ikke valgt noget til backup endnu.
Vælg, hvad der skal tages backup af, under »Avanceret« med »Ændr opsætning…« og »Vælg, hvad der skal tages backup af…«.

#38 Opsætningen på dette USB-stik kan ikke læses.
Gå tilbage, og prøv igen. Hvis det sker igen, så se #6.

#39 Der er ikke sat noget USB-stik i, som Babawus kan formatere.
Babawus formaterer kun USB-stik, aldrig computerens egne diske. Sæt det USB-stik i, der skal forberedes.

#40 Kun en administrator kan vælge Ext4.
Formatering som Ext4 kræver en konto med sudo-rettigheder og adgangskoden til den konto. Vælg exFAT i stedet, eller forbered USB-stikket fra en administrators konto.

#41 USB-stikket blev taget ud.
USB-stikket blev taget ud, mens det blev formateret. Sæt det i igen, og formatér det igen.

#42 Babawus kan ikke længere formatere dette USB-stik.
USB-stikket blev ændret, efter det blev valgt, for eksempel fordi et program åbnede det. Luk programmet, gå tilbage, og vælg USB-stikket igen.

#43 USB-stikket blev formateret, men Babawus kunne ikke sætte det op til backup.
Formatér det igen. Hvis det sker igen, så brug et andet USB-stik.

#44 Formateringen virkede ikke.
Meddelelsen under den siger, hvad systemet meldte. Tag USB-stikket ud, sæt det i igen, og prøv igen. Hvis det sker igen, så brug et andet USB-stik.

#45 USB-stikket er slettet, men er ikke klar til backup.
Formatér det igen.

#46 Opsætningen på dette USB-stik er ændret uden for Babawus eller er beskadiget.
Kontrollér, hvad opsætningen viser, ret det, der er forkert, og gem den. Når den gemmes, bliver den gyldig igen.

#47 Opsætningen på dette USB-stik kan slet ikke læses.
Start en ny opsætning. Backups, der allerede er på USB-stikket, bevares, og deres mapper bliver brugt igen.

#48 Opsætningen på dette USB-stik kræver en nyere Babawus.
Den blev lavet med en nyere version af Babawus. Installér den version på denne computer.

#49 Dette USB-stik har ikke længere nogen Babawus-opsætning.
Opsætningen blev fjernet fra USB-stikket, mens det var åbent her. Gå tilbage. For at bruge USB-stikket igen skal det forberedes under »Avanceret«, hvilket sletter alt på det, så kopiér først det, du vil beholde.

#50 Denne computer har intet id.
Babawus skelner computere fra hinanden ved det id, systemet giver hver installation, i /etc/machine-id, og denne computer har intet. Et id oprettes med systemets egne værktøjer, for eksempel »sudo systemd-machine-id-setup« i en terminal.

