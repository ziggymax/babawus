# The built-in Help (issues 151 and 154). A line starting with "# " is a heading, a line starting
# with "- " is a bullet, and a line starting with "#" and a number is the entry for that message.
Help = """
# Hvad Babawus gør

Babawus kopierer dine vigtige filer og mapper til et USB-stik, så du stadig har dem hvis computeren går i stykker, bliver væk, bliver stjålet eller hvis du ved en fejl sletter eller ødelægger en fil.

Babawus kopierer kun det, der er ændret siden sidste backup. Når en fil er ændret, bliver kopien på USB-stikket erstattet, og den tidligere kopi gemmes som en ældre version. Filer, du sletter på computeren, bliver aldrig slettet fra USB-stikket.

# Tag backup

- Sæt dit backup-stik i.
- Vælg stikket på listen, hvis det ikke allerede er valgt.
- Tryk på »Start backup«, og vent på resultatet.
- Når der står »Alt er i orden«, så tryk på »Skub ud«, og tag USB-stikket ud.

Opbevar USB-stikket væk fra computeren mellem backups, så hvad måtte der ske med computeren, ikke også sker med USB-stikket. To USB-stik, der bruges på skift, er mere sikkert end ét.

»Vis historik« viser, hvornår der blev taget backup til USB-stikket, og hvordan det gik. »Hvad der tages backup af« viser, hvilke af dine filer og mapper der kopieres til det.

# Få filer tilbage

Babawus har ingen gendannelsesknap. Åbn USB-stikket i filhåndteringen: dine filer ligger i mappen »backup«, under computerens og dit eget navn, i de samme mapper som på computeren. Kopiér det, du har brug for, tilbage. De ældre versioner af en fil ligger i en mappe ved siden af med samme navn filen, men med [] i, for eksempel rapport[]pdf for rapport.pdf, hver med dato og klokkeslæt for, hvornår den blev erstattet, i navnet.

# Avancerede funktioner

Under »Avanceret« i menuen ligger de funktioner, der sætter et USB-stik op: »Forbered…« sletter alt på et USB-stik og gør det klar til Babawus, og »Ændr opsætning…« vælger, hvad der tages backup af, og for hvilke computere og konti. En fejl her kan koste backups, så Babawus spørger først. »Avanceret« slås fra igen, når Babawus lukkes.

# Meddelelser

Når noget går galt, slutter meddelelsen med et nummer, for eksempel #14. Søg efter nummeret her for at se, hvad det betyder, og hvad du skal gøre.

#1 USB-stikket er ikke åbnet.
Systemet har ikke åbnet USB-stikket. Tag det ud, og sæt det i igen. Hvis det ikke hjælper, så åbn USB-stikket i filhåndteringen.

#2 Det USB-stik, der er sat i, kan ikke bruges endnu.
Der er intet på USB-stikket, som Babawus kan læse, for eksempel fordi det er nyt eller har været brugt til noget andet. Forbered det under »Avanceret« med »Forbered…«. Det sletter alt på det.

#3 Babawus kan ikke se USB-stikkene.
Systemets tjeneste udisks2, som Babawus bruger til at finde USB-stik, kører ikke. En genstart af computeren starter den som regel igen.

#4 Babawus er allerede åbent for en anden konto.
Der kan kun køre én Babawus ad gangen på en computer. Bed den anden person om at lukke det, eller skift til vedkommendes konto, og luk det der.

#5 Dette USB-stik er ikke sat op til dig på denne computer.
Hver computer og konto skal tilføjes til et USB-stik, før den kan tage backup til det. Gør det under »Avanceret« med »Ændr opsætning…« og »Tilføj denne computer og din konto«.

#6 Opsætningen på dette USB-stik er beskadiget eller kræver en nyere Babawus.
Hvis USB-stikket blev sat op med en nyere Babawus, så installér også den version her. Ellers er opsætningen beskadiget: åbn den under »Avanceret« med »Ændr opsætning…«, kontrollér den, og gem den.

#7 Dette USB-stik kan kun læses.
Nogle USB-stik har en lille låseknap: skub den til ulåst. Et USB-stik, der ikke længere kan skrives til, kan være slidt op; brug et andet.

#8 Dette USB-stik er stadig åbent for en anden konto.
En anden konto på denne computer har USB-stikket åbent, så denne konto kan ikke bruge det. Hvis ingen andre bruger det, så tag det ud, og sæt det i igen.

#9 Dette USB-stik er ikke sat op til backup med Babawus.
Forbered det under »Avanceret« med »Forbered…«. Det sletter alt på det, så kopiér først det, du vil beholde.

#10 USB-stikket blev taget ud.
USB-stikket blev taget ud under backuppen. Intet af det, der allerede er på det, er beskadiget. Sæt det i igen, og kør backuppen igen: den fortsætter, hvor den stoppede.

#11 Backuppen blev afbrudt.
Backuppen blev stoppet undervejs, for eksempel fordi computeren blev slukket. Kør den igen: den fortsætter, hvor den stoppede.

#12 Babawus stoppede uventet.
Babawus sluttede midt i backuppen. Intet af det, der allerede er på USB-stikket, er beskadiget. Kør backuppen igen.

#13 De sidste ændringer kunne ikke gemmes på USB-stikket.
USB-stikket bekræftede ikke, at alt var skrevet. Kør backuppen igen. Hvis det sker igen, er USB-stikket måske ved at gå i stykker; brug et andet.

#14 USB-stikket er fuldt.
Der er ikke plads til de filer, der er ændret. Gem færre ældre versioner under »Avanceret« med »Ændr opsætning…«, tag backup af færre filer, eller brug et større USB-stik.

#15 Dette USB-stik er ikke sat op til dig på denne computer.
Opsætningen blev ændret, efter backuppen var startet. Se #5.

#16 Opsætningen på dette USB-stik er beskadiget eller kræver en nyere Babawus.
