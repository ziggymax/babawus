# The built-in Help, shown in a window of its own (issues 151, 154 and 158). A line starting with
# "# " is a heading, a line starting with "- " is a bullet, and blank lines separate paragraphs. A
# line with only "#" and a number, such as "#14", begins the entry for that numbered message, and
# Babawus writes the message after the number itself: every number needs an entry. Another text
# is put in with its name in braces, such as {ChangeSetup}. Quotation marks are written as plain
# "", and shown as the marks in quotes above.
Help = """
# Was Babawus macht

Babawus kopiert deine wichtigen Dateien und Ordner auf einen USB-Stick, damit du sie noch hast, wenn dein Computer kaputtgeht, verloren geht oder gestohlen wird, oder wenn du aus Versehen eine Datei löschst oder verdirbst.

Es kopiert nur, was sich seit der letzten Sicherung geändert hat. Hat sich eine Datei geändert, wird die Kopie auf dem Stick ersetzt, und die frühere Kopie bleibt als ältere Version erhalten. Dateien, die du auf dem Computer löschst, werden nie vom Stick gelöscht.

# Sichern

- Steck deinen Sicherungs-Stick ein.
- Wähle ihn in der Liste, wenn er nicht schon gewählt ist.
- Drück "{StartBackup}" und warte auf das Ergebnis.
- Wenn es "{VerdictAllGood}" heißt, drück auf "Auswerfen" und zieh den Stick ab.

Bewahre den Stick zwischen den Sicherungen getrennt vom Computer auf, damit das, was dem Computer passiert, nicht auch dem Stick passiert. Zwei Sticks, abwechselnd benutzt, sind sicherer als einer.

"{ShowHistory}" zeigt, wann auf den Stick gesichert wurde und wie es lief. "{WhatsBackedUp}" zeigt, welche deiner Dateien und Ordner darauf kopiert werden.

# Dateien zurückholen

Drück "{RestoreFiles}" unter dem Stick, um Dateien zurückzuholen. Setz einen Haken bei den Dateien und Ordnern, die du willst, wie beim Auswählen, was gesichert wird. Eine Datei zeigt ihre neueste Kopie und ihre älteren Versionen, jede mit ihrem Datum: Wähl sie aus und such rechts eine Version aus. Die Dateien kommen dorthin zurück, wo sie waren, oder in einen anderen Ordner, den du auswählst, und Babawus fragt vorher nach Dateien, die schon da sind. Beim Wiederherstellen ändert Babawus den Stick nie.

Du kannst den Stick auch in der Dateiverwaltung öffnen: Deine Dateien liegen im Ordner "backup", unter dem Namen des Computers und deinem eigenen, in denselben Ordnern wie auf dem Computer. Die älteren Versionen einer Datei liegen in einem Ordner daneben, der wie die Datei heißt, aber [] im Namen hat, etwa report[]pdf für report.pdf, jede mit Datum und Uhrzeit, zu der sie ersetzt wurde, im Namen.

# Erweiterte Funktionen

Unter "{MenuAdvanced}" im Menü stehen die Funktionen, mit denen ein Stick eingerichtet wird: "{Prepare}" löscht einen Stick und macht ihn für Babawus bereit, und mit "{ChangeSetup}" wählst du, was gesichert wird und für welche Computer und Konten. Ein Fehler kann hier Sicherungen kosten, deshalb fragt Babawus vorher nach. "{MenuAdvanced}" schaltet sich wieder aus, wenn Babawus geschlossen wird.

# Meldungen

Wenn etwas schiefgeht, endet die Meldung mit einer Nummer, etwa #14. Such hier nach dieser Nummer, um zu sehen, was sie bedeutet und was zu tun ist.

#1
Das System hat die Dateien des Sticks nicht geöffnet. Wenn erneutes Einstecken nicht hilft, öffne den Stick in der Dateiverwaltung.

#2
Auf dem Stick ist nichts, was Babawus lesen kann, etwa weil er neu ist oder für etwas anderes benutzt wurde. Bereite ihn unter "{MenuAdvanced}" mit "{Prepare}" vor. Dabei wird alles darauf gelöscht.

#3
Babawus findet Sticks mit dem Systemdienst udisks2.

#4
Auf einem Computer kann immer nur ein Babawus laufen, deshalb muss es zuerst im anderen Konto geschlossen werden.

#5
Jeder Computer und jedes Konto muss zu einem Stick hinzugefügt werden, bevor darauf gesichert werden kann. Das geht unter "{MenuAdvanced}" mit "{ChangeSetup}" und "{SetupAddComputer}".

#6
Wurde der Stick mit einem neueren Babawus eingerichtet, installiere diese Version auch hier. Sonst ist die Einrichtung beschädigt: Öffne sie unter "{MenuAdvanced}" mit "{ChangeSetup}", prüfe sie und speichere sie.

#7
Manche Sticks haben einen kleinen Schiebeschalter. Ein Stick, auf den nicht mehr geschrieben werden kann, ist vielleicht abgenutzt; nimm einen anderen.

#8
Ein anderes Konto auf diesem Computer hat den Stick geöffnet, deshalb kann dieses Konto ihn nicht benutzen.

#9
Bereite ihn unter "{MenuAdvanced}" mit "{Prepare}" vor. Dabei wird alles darauf gelöscht, kopiere also vorher, was du behalten willst.

#10
Der Stick wurde während der Sicherung abgezogen. Was schon darauf ist, ist nicht beschädigt. Steck ihn wieder ein und starte die Sicherung noch einmal: Sie macht dort weiter, wo sie aufgehört hat.

#11
Die Sicherung wurde mittendrin angehalten, etwa weil der Computer ausgeschaltet wurde. Starte sie noch einmal: Sie macht dort weiter, wo sie aufgehört hat.

#12
Babawus wurde mitten in der Sicherung beendet. Was schon auf dem Stick ist, ist nicht beschädigt. Starte die Sicherung noch einmal.

#13
Der Stick hat nicht bestätigt, dass alles geschrieben wurde. Starte die Sicherung noch einmal. Wenn es wieder passiert, geht der Stick vielleicht kaputt; nimm einen anderen.

#14
Für die geänderten Dateien ist kein Platz. Bewahre unter "{MenuAdvanced}" mit "{ChangeSetup}" weniger ältere Versionen auf, sichere weniger Dateien oder nimm einen größeren Stick.

#15
Die Einrichtung hat sich geändert, nachdem die Sicherung gestartet wurde. Siehe #5.

#16
Siehe #6.

#17
Prüfe, ob der Stick einen Schiebeschalter hat, siehe #7. Sonst geht er vielleicht kaputt; nimm einen anderen.

#18
Warte, bis sie fertig ist, und versuch es dann noch einmal.

#19
Die Datei oder der Ordner konnte auf dem Computer nicht gelesen werden, meistens weil dein Konto sie nicht lesen darf. Sie wird übersprungen.

#20
Die Datei wurde während der Sicherung gelöscht oder verschoben. Sie wird beim nächsten Mal gesichert, wenn sie noch da ist.

#21
Der Stick hat die Datei nicht angenommen. Starte die Sicherung noch einmal. Wenn es wieder passiert, siehe #17.

#22
Was früher ein Ordner war, ist jetzt eine Datei mit demselben Namen, oder umgekehrt. Benenne sie auf dem Computer um, oder entferne das alte vom Stick in der Dateiverwaltung.

#23
Ein Programm hat die Datei während der Sicherung ständig geändert. Schließ dieses Programm und starte die Sicherung noch einmal.

#24
Der Name einer älteren Version bekommt das Datum dazu, und dadurch wurde er zu lang. Gib der Datei einen kürzeren Namen.

#25
Mit exFAT formatierte Sticks können die Zeichen " * : < > ? \\ | nicht in Namen speichern. Benenne die Datei um, oder nimm einen mit Ext4 formatierten Stick.

#26
Benenne die Datei so um, dass ihr Name nicht mit einem Punkt endet.

#27
Der Name enthält Zeichen, die der Computer nicht als Text zeigen kann. Benenne die Datei um.

#28
Der Name, oder die Namen der Ordner, in denen sie liegt, sind für den Stick zu lang. Nimm kürzere Namen oder weniger ineinander liegende Ordner.

#29
Babawus bewahrt ältere Versionen in Ordnern auf, deren Namen [] enthalten, und dieser Name enthält auch []. Benenne ihn um.

#30
exFAT-Sticks können "Foto.jpg" und "foto.jpg" nicht unterscheiden. Benenne eine der beiden um.

#31
Eine ausgewählte Datei oder ein ausgewählter Ordner wurde gelöscht, verschoben oder umbenannt. Wähle sie unter "{MenuAdvanced}" mit "{ChangeSetup}" neu aus.

#32
Gesichert werden nur Dateien in deinem persönlichen Ordner. Wähle unter "{MenuAdvanced}" mit "{ChangeSetup}" Dateien darin aus.

#33
Schließ das Programm, etwa ein Fenster der Dateiverwaltung oder ein Terminal, das auf dem Stick geöffnet ist, oder warte, bis ein Kopiervorgang fertig ist, und wirf ihn noch einmal aus.

#34
Wenn es immer noch nicht geht, fahr den Computer herunter, bevor du den Stick abziehst.

#35
Wenn es wieder passiert, zieh den Stick ab und steck ihn wieder ein.

#36
Schließ das Protokollfenster und versuch es noch einmal. Wenn es wieder passiert, zieh den Stick ab und steck ihn wieder ein.

#37
Wähle unter "{MenuAdvanced}" mit "{ChangeSetup}" und "{SetupChoose}", was gesichert werden soll.

#38
Wenn es wieder passiert, siehe #6.

#39
Babawus formatiert nur USB-Sticks, nie die eigenen Laufwerke des Computers. Steck den Stick ein, der vorbereitet werden soll.

#40
Zum Formatieren mit Ext4 braucht man ein Konto mit sudo-Rechten und das Passwort dieses Kontos. Wähle stattdessen exFAT, oder bereite den Stick von einem Administratorkonto aus vor.

#41
Der Stick wurde beim Formatieren abgezogen. Steck ihn wieder ein und formatiere ihn noch einmal.

#42
Der Stick hat sich verändert, nachdem er gewählt wurde, etwa weil ein Programm ihn geöffnet hat. Schließ dieses Programm, geh zurück und wähle den Stick noch einmal.

#43
Formatiere ihn noch einmal. Wenn es wieder passiert, nimm einen anderen Stick.

#44
Die Meldung darunter sagt, was das System gemeldet hat. Zieh den Stick ab, steck ihn wieder ein und versuch es noch einmal. Wenn es wieder passiert, nimm einen anderen Stick.

#45
Wenn es wieder passiert, nimm einen anderen Stick.

#46
Prüfe, was die Einrichtung zeigt, korrigiere, was falsch ist, und speichere sie. Durch das Speichern wird sie wieder gültig.

#47
Beginne sie unter "{MenuAdvanced}" mit "{ChangeSetup}" und "{SetupStartNew}".

#48
Sie wurde mit einer neueren Version von Babawus gemacht. Installiere diese Version auf diesem Computer.

#49
Die Einrichtung wurde vom Stick entfernt, während sie hier geöffnet war. Geh zurück. Um den Stick wieder zu benutzen, bereite ihn unter "{MenuAdvanced}" vor. Dabei wird er gelöscht, kopiere also vorher, was du behalten willst.

#50
Babawus unterscheidet Computer an der Kennung, die das System jeder Installation in /etc/machine-id gibt, und dieser Computer hat keine. Sie lässt sich nur mit Werkzeugen des Systems anlegen, etwa mit "sudo systemd-machine-id-setup" in einem Terminal.

#51
Die Einrichtung kann nicht gespeichert werden, während eine Sicherung auf den Stick schreibt.

#52
Zwei Computer oder zwei Sicherungsprofile bekämen denselben Ordner auf dem Stick. Wähle einen anderen.

#53
Babawus kann sie nicht verknüpfen, ohne sie zu vermischen. Verschiebe in der Dateiverwaltung, was du brauchst, von einem Ordner in den anderen, entferne den leeren und versuch es noch einmal.

#54
Die Meldung sagt, warum. Prüfe, ob der Stick noch eingesteckt und nicht gesperrt ist, und speichere noch einmal.

#55
Dein Konto darf ihn nicht lesen, deshalb kann er nicht gesichert werden.

#56
Wähle weniger aus, oder nimm einen größeren Stick.

#57
Der Stick wurde vielleicht herausgezogen, oder die Kopie darauf ist beschädigt. Steck den Stick wieder ein und stell die Datei noch einmal wieder her. Passiert es wieder, ist der Stick vielleicht defekt; versuch eine ältere Version der Datei.

#58
Prüf, ob du in den Ordner schreiben darfst und ob auf dem Datenträger Platz ist. Stell die Datei dann noch einmal wieder her.

#59
Ein Ordner, eine Verknüpfung oder eine andere Datei hat den Namen der Datei, oder eine Datei hat den Namen eines ihrer Ordner. Benenne sie um oder verschieb sie, oder stell in einen anderen Ordner wieder her.

#60
Schaff Platz auf dem Datenträger oder stell in einen Ordner auf einem anderen Datenträger wieder her, und stell dann den Rest noch einmal wieder her.

#61
Wähl einen Ordner auf dem Computer oder auf einem anderen Datenträger.

#62
Zieh den Stick heraus und steck ihn wieder ein. Passiert es wieder, siehe #6.
"""
